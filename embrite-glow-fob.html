<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEC Accessories Embrite Glow Fob Review — JaveomoTech</title>
  <meta name="description" content="An honest review of the TEC Accessories Embrite Glow Fob. Is this $22.95 radioactive-looking glow stick worth it for your EDC setup?" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f7f4; --white: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
      --accent: #0057ff; --accent-light: #e8eeff; --border: #e2e0db; --radius: 14px;
      --tag-purple: #f3eeff; --tag-purple-text: #5b21b6;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

    /* NAV */
    nav { position: sticky; top: 0; z-index: 100; background: rgba(248,247,244,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .nav-logo { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
    .nav-logo span { color: var(--accent); }
    .nav-yt { display: flex; align-items: center; gap: 6px; background: #ff0000; color: white; border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 600; text-decoration: none; }
    .nav-yt svg { width: 15px; height: 15px; fill: white; }

    /* REVIEW CONTAINER */
    .review-container { max-width: 960px; margin: 40px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

    /* LEFT: IMAGES */
    .gallery-wrap { position: sku; top: 100px; }
    .main-img { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; height: 400px; display: flex; align-items: center; justify-content: center; padding: 24px; margin-bottom: 12px; }
    .main-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .thumb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .thumb-btn { background: var(--white); border: 1px solid var(--border); border-radius: 8px; padding: 8px; height: 80px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.18s; }
    .thumb-btn:hover, .thumb-btn.active { border-color: var(--accent); }
    .thumb-btn img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* RIGHT: CONTENT */
    .review-meta { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    .product-tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: var(--tag-purple); color: var(--tag-purple-text); }
    .review-price { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 700; color: var(--accent); }
    
    .review-content h1 { font-family: 'Syne', sans-serif; font-size: clamp(24px, 4vw, 36px); font-weight: 800; line-height: 1.1; letter-spacing: -1px; margin-bottom: 16px; }
    .review-text { color: var(--text); font-size: 15px; margin-bottom: 24px; }
    .review-text p { margin-bottom: 16px; }
    .review-text strong { color: var(--text); }
    
    .buy-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: var(--accent); color: white; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; text-decoration: none; transition: opacity 0.18s; margin-bottom: 32px; text-align: center; }
    .buy-btn
